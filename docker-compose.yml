# =============================================================================
# docker-compose.yml (desenvolvimento — SaaSPlatformDev Core com FinIA)
# =============================================================================
# Sobe PostgreSQL + pgAdmin + Evolution API (WhatsApp) para dev local.
#
# Uso:
#   docker compose up -d
#   cd apps/backend && npm run dev
#   cd apps/frontend && npm run dev
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saas_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas_dev_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saas_dev_net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-saas_evolution_secret}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://postgres:postgres@postgres:5432/saas_dev?schema=evolution"
      DATABASE_CONNECTION_CLIENT_NAME: "evolution_api"
      CACHE_REDIS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saas_dev_net

networks:
  saas_dev_net:
    driver: bridge

volumes:
  postgres_dev_data:
